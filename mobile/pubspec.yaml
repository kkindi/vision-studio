name: visionstudio_mobile
description: "Vision Studio mobile - offline object detection & counting for Android + iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # On-device YOLO inference (Android = TFLite, iOS = CoreML), camera + NMS built in.
  # If the version below is unavailable, run:  flutter pub add ultralytics_yolo
  ultralytics_yolo: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
